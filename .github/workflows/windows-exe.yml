name: Windows EXE
on:
  push:
    branches: ["develop/v0.1.0"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install packager
        shell: pwsh
        run: python -m pip install --requirement requirements-build.txt
      - name: Compile all source modules
        shell: pwsh
        run: python -m compileall -q src tests
      - name: Run deterministic simulations and negative regressions
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Build Windows x64 standalone EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name 125A-Fake-IDE --paths src src/main.py
      - name: Smoke test packaged EXE (no GUI)
        shell: pwsh
        run: |
          $smoke = Start-Process -FilePath .\dist\125A-Fake-IDE.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "EXE self-test failed: $($smoke.ExitCode)" }
          if (!(Test-Path .\dist\125A-Fake-IDE.exe)) { throw "EXE missing" }
          Get-FileHash .\dist\125A-Fake-IDE.exe -Algorithm SHA256 | Format-List
      - name: Upload standalone Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Fake-IDE-Windows-x64
          path: dist/125A-Fake-IDE.exe
          if-no-files-found: error
          retention-days: 30
